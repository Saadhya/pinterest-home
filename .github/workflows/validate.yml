name: Validate Files
on: 
  push:
  workflow_dispatch: 
jobs:
  file-validate:
    runs-on: "ubuntu-latest"

    steps: 
    - name: Get repo code on VM
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: validate html file
      run: test -f index.html

    - name: validate TSX file
      run: test -f src/main.tsx

    - name: validate TypeScript file
      run: npx tsc --noEmit --project tsconfig.app.json

    - name: validate css file
      run: test -f src/styles.css
